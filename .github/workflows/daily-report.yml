name: daily-report

on:
  schedule:
    - cron: "0 1 * * *"  # 每天 UTC 01:00（北京时间 09:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install akshare pandas

      - name: Run Buffett screen (20 representative A-shares)
        run: python .github/scripts/daily_report.py

      - name: Commit reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily buffett screen report"
          file_pattern: "reports/*"
